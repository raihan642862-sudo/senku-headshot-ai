name: Build SENKU HEADSHOT AI Debug APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project ZIP if Uploaded Directly
        run: |
          for z in *.zip; do
            if [ -f "$z" ]; then
              unzip -o "$z"
            fi
          done
    - name: Fix SDK Version
          run: |
                  sed -i 's/compileSdk = 36/compileSdk = 35/g; s/targetSdk = 36/targetSdk = 35/g' **/build.gradle.kts app/build.gradle.kts 2>/dev/null || true
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK & Run Unit Tests
        run: |
          if [ -d "SenkuHeadshotAI" ] && [ -f "SenkuHeadshotAI/settings.gradle.kts" ]; then
            cd SenkuHeadshotAI
          fi
          gradle assembleDebug testDebugUnitTest --stacktrace

      - name: Upload SENKU HEADSHOT AI Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SENKU-HEADSHOT-AI-Debug-APK
          path: |
            **/app/build/outputs/apk/debug/app-debug.apk
